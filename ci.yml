name: CI DB App

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Docker Compose
        run: docker compose up -d

      - name: Esperar servicios
        run: sleep 20

      - name: Verificar contenedores
        run: docker ps
